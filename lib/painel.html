<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registo de Editais · CMMB</title>
<style>
  :root{
    --verde-selo:#0D4D33; --verde-fundo:#0a3d28; --verde-escuro:#06271a; --verde-vivo:#1c6b48;
    --ouro:#C8A84B; --ouro-claro:#e6cf8d; --ouro-escuro:#9c7d2c;
    --papel:#f4f1e8; --papel-ficha:#fffdf7; --papel-2:#e9e4d5;
    --tinta:#23291f; --tinta-suave:#6b6f63; --linha:#ddd6c4;
    --rascunho:#9a8f76; --validado:#2f8f5b; --publicado:#0D4D33; --retirado:#b0a99a;
    --alerta:#b07d2a; --alerta-fundo:#fbf3e2;
    --sombra-ficha:0 1px 2px rgba(6,39,26,.04),0 8px 24px rgba(6,39,26,.08);
    --sombra-carta:0 2px 6px rgba(6,39,26,.06),0 20px 50px rgba(6,39,26,.14);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  body{font-family:var(--sans);background:var(--papel);color:var(--tinta);line-height:1.55;
    -webkit-font-smoothing:antialiased;font-size:15.5px}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.4;
    background-image:radial-gradient(circle at 20% 30%,rgba(200,168,75,.04),transparent 40%),
      radial-gradient(circle at 80% 70%,rgba(13,77,51,.03),transparent 45%)}
  .app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;position:relative;z-index:1}

  aside{background:linear-gradient(168deg,var(--verde-selo),var(--verde-escuro));
    color:#e9f2ec;padding:24px 16px;border-right:3px solid var(--ouro);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .marca{display:flex;align-items:center;gap:12px;padding:0 8px 22px;margin-bottom:8px;
    border-bottom:1px solid rgba(255,255,255,.1)}
  .marca .selo{width:40px;height:40px;flex:0 0 40px}
  .marca h1{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.15;color:#fff}
  .marca .sub{font-size:10.5px;color:var(--ouro-claro);letter-spacing:.1em;text-transform:uppercase;margin-top:1px}
  nav{display:flex;flex-direction:column;gap:3px;margin-top:6px}
  nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:none;border:none;color:#cfe0d6;font-family:var(--sans);font-size:14.5px;
    padding:11px 12px;border-radius:9px;cursor:pointer;transition:.15s;position:relative}
  nav button .ic{width:20px;height:20px;flex:0 0 20px;opacity:.85}
  nav button .txt{flex:1}
  nav button .badge{font-family:var(--serif);font-size:12.5px;font-weight:700;
    background:rgba(255,255,255,.12);color:#fff;border-radius:20px;padding:1px 9px;min-width:24px;text-align:center}
  nav button:hover{background:rgba(255,255,255,.07);color:#fff}
  nav button.ativo{background:rgba(200,168,75,.16);color:#fff}
  nav button.ativo::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;
    background:var(--ouro);border-radius:0 3px 3px 0}
  nav button.ativo .badge{background:var(--ouro);color:var(--verde-escuro)}
  nav .destaque .badge{background:var(--ouro);color:var(--verde-escuro)}
  aside .rodape{margin-top:auto;padding:14px 10px 0;border-top:1px solid rgba(255,255,255,.1);
    font-size:12px;color:#a9c3b4}
  aside .rodape b{color:#fff;display:block;font-size:13px}

  main{padding:0;min-width:0}
  .barra{display:flex;align-items:center;gap:16px;padding:22px 34px 18px;
    border-bottom:1px solid var(--linha);position:sticky;top:0;background:rgba(244,241,232,.92);
    backdrop-filter:blur(8px);z-index:10}
  .barra h2{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:-.01em}
  .barra .desc{font-size:13px;color:var(--tinta-suave);margin-top:1px}
  .barra .busca{margin-left:auto;position:relative}
  .barra .busca input{width:240px;padding:9px 12px 9px 34px;border:1px solid var(--linha);
    border-radius:20px;background:var(--papel-ficha);font-family:var(--sans);font-size:14px}
  .barra .busca input:focus{outline:none;border-color:var(--ouro);box-shadow:0 0 0 3px rgba(200,168,75,.15)}
  .barra .busca svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5}
  .conteudo{padding:26px 34px 60px}

  .carimbo{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
    padding:4px 11px;border-radius:5px;border:1.5px solid;transform:rotate(-1.2deg)}
  .carimbo::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
  .carimbo.rascunho{color:var(--rascunho);border-color:var(--rascunho);background:#f3efe3}
  .carimbo.validado{color:var(--validado);border-color:var(--validado);background:#eaf6ee}
  .carimbo.publicado{color:var(--publicado);border-color:var(--publicado);background:#e7f1eb}
  .carimbo.retirado{color:var(--retirado);border-color:var(--retirado);background:#f0ede4}

  .grelha{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .ficha{background:var(--papel-ficha);border:1px solid var(--linha);border-radius:12px;
    padding:16px 16px 14px;box-shadow:var(--sombra-ficha);cursor:pointer;
    transition:transform .13s,box-shadow .13s,border-color .13s;position:relative;overflow:hidden}
  .ficha::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--linha)}
  .ficha.e-rascunho::before{background:var(--rascunho)}
  .ficha.e-validado::before{background:var(--validado)}
  .ficha.e-publicado::before{background:var(--publicado)}
  .ficha.e-retirado::before{background:var(--retirado)}
  .ficha:hover{transform:translateY(-3px);box-shadow:var(--sombra-carta);border-color:var(--ouro)}
  .ficha .cab{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:9px}
  .ficha .reg{font-family:var(--serif);font-size:13px;color:var(--ouro-escuro);font-weight:700;letter-spacing:.02em}
  .ficha .reg small{display:block;font-family:var(--sans);font-size:10.5px;color:var(--tinta-suave);
    font-weight:400;letter-spacing:.04em;text-transform:uppercase;margin-top:1px}
  .ficha .assunto{font-size:14.5px;font-weight:600;line-height:1.38;margin-bottom:11px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .ficha .meta{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--tinta-suave);
    border-top:1px dashed var(--linha);padding-top:9px}
  .ficha .meta .l{display:flex;justify-content:space-between}
  .ficha .meta b{color:var(--tinta);font-weight:600}
  .ficha .aviso{margin-top:10px;display:inline-flex;align-items:center;gap:5px;font-size:11px;
    color:var(--alerta);background:var(--alerta-fundo);border:1px solid #e9d3a3;border-radius:20px;padding:3px 9px;font-weight:600}

  .foco{display:grid;grid-template-columns:1.05fr .95fr;gap:28px;align-items:start;max-width:1200px}
  .foco .doc{background:var(--verde-selo);border-radius:14px;padding:16px;box-shadow:var(--sombra-carta);position:sticky;top:96px}
  .foco .doc img{width:100%;border-radius:8px;display:block;background:var(--papel-2);min-height:200px}
  /* Pré-visualização clicável: cursor de lupa e leve realce ao passar. */
  .previa-img{cursor:zoom-in;transition:filter .15s}
  .previa-img:hover{filter:brightness(1.04)}
  /* Lightbox de ampliação da pré-visualização. */
  .lightbox{position:fixed;inset:0;z-index:100;background:rgba(7,42,28,.92);
    display:none;align-items:center;justify-content:center;padding:32px}
  .lightbox.aberto{display:flex}
  .lightbox img{max-width:95%;max-height:95%;object-fit:contain;border-radius:8px;
    box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .lb-fechar{position:absolute;top:20px;right:24px;background:rgba(255,255,255,.15);
    border:none;color:#fff;width:44px;height:44px;border-radius:10px;font-size:22px;cursor:pointer}
  .lb-fechar:hover{background:rgba(255,255,255,.28)}
  .foco .doc .doc-vazio{text-align:center;padding:60px 20px;font-size:13px;color:#9fc0af}
  .foco .ficha-edicao{background:var(--papel-ficha);border:1px solid var(--linha);border-radius:14px;
    padding:24px;box-shadow:var(--sombra-ficha)}
  .foco .ficha-edicao .topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .foco .ficha-edicao .reg-grande{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--tinta)}
  .foco .progresso{font-size:12.5px;color:var(--tinta-suave);margin-bottom:20px}

  .campo{margin-bottom:17px}
  .campo label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--tinta-suave);margin-bottom:6px;font-weight:700}
  .campo input,.campo textarea{width:100%;padding:11px 13px;border:1px solid var(--linha);
    border-radius:9px;font-family:var(--sans);font-size:14.5px;background:var(--papel);color:var(--tinta);transition:.15s}
  .campo textarea{resize:vertical;min-height:56px;line-height:1.45}
  .campo input:focus,.campo textarea:focus{outline:none;border-color:var(--ouro);
    box-shadow:0 0 0 3px rgba(200,168,75,.16);background:var(--papel-ficha)}
  .campo.duvidoso input,.campo.duvidoso textarea{border-color:var(--alerta);background:var(--alerta-fundo)}
  .campo .nota-conf{font-size:11.5px;color:var(--alerta);margin-top:5px;display:none;align-items:center;gap:5px}
  .campo.duvidoso .nota-conf{display:flex}
  .campo .obrig{color:var(--ouro-escuro)}

  .acoes{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;padding-top:20px;border-top:1px solid var(--linha)}
  .btn{border:none;border-radius:10px;padding:11px 18px;font-family:var(--sans);font-size:14px;
    font-weight:600;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px}
  .btn:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
  .btn-acao{background:var(--ouro);color:var(--verde-escuro)}
  .btn-acao:hover{background:var(--ouro-claro)}
  .btn-validar{background:var(--validado);color:#fff}
  .btn-validar:hover{filter:brightness(1.08)}
  .btn-neutro{background:var(--papel-2);color:var(--tinta);border:1px solid var(--linha)}
  .btn-neutro:hover{border-color:var(--ouro)}
  .btn-perigo{background:var(--papel-ficha);color:var(--alerta);border:1px solid #e9d3a3}
  .btn-perigo:hover{background:var(--alerta-fundo)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.larga{margin-left:auto}

  .foco-nav{display:flex;align-items:center;gap:10px;margin-bottom:20px}
  .foco-nav button{background:var(--papel-ficha);border:1px solid var(--linha);border-radius:8px;
    width:36px;height:36px;cursor:pointer;font-size:16px;color:var(--tinta);transition:.15s}
  .foco-nav button:hover:not(:disabled){border-color:var(--ouro)}
  .foco-nav button:disabled{opacity:.35;cursor:not-allowed}
  .foco-nav .pos{font-size:13px;color:var(--tinta-suave)}
  .foco-nav .atalhos{margin-left:auto;font-size:12px;color:var(--tinta-suave);opacity:.7}
  .foco-nav .atalhos b{color:var(--ouro-escuro);font-family:monospace;background:var(--papel-ficha);
    border:1px solid var(--linha);border-radius:4px;padding:1px 5px}

  .historico{margin-top:22px;padding-top:18px;border-top:1px solid var(--linha)}
  .historico h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--tinta-suave);margin-bottom:12px}
  .historico .ev{font-size:12.5px;padding:9px 0;border-bottom:1px dashed var(--linha);color:var(--tinta-suave);
    display:flex;gap:10px;align-items:baseline}
  .historico .ev .quem{font-weight:700;color:var(--tinta);white-space:nowrap}
  .historico .ev .fluxo{color:var(--ouro-escuro)}
  .historico .ev .quando{margin-left:auto;white-space:nowrap;font-size:11.5px}

  .kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:start}
  .coluna{background:var(--papel-2);border-radius:12px;padding:12px}
  .coluna h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--tinta-suave);
    margin-bottom:12px;display:flex;align-items:center;gap:8px;padding:2px 4px}
  .coluna h3 .pt{width:9px;height:9px;border-radius:50%}
  .coluna h3 .cnt{margin-left:auto;font-family:var(--serif);color:var(--tinta);font-weight:700}
  .coluna.c-rascunho h3 .pt{background:var(--rascunho)} .coluna.c-validado h3 .pt{background:var(--validado)}
  .coluna.c-publicado h3 .pt{background:var(--publicado)} .coluna.c-retirado h3 .pt{background:var(--retirado)}
  .coluna .ficha{margin-bottom:10px}
  .coluna .ficha .assunto{font-size:13.5px;-webkit-line-clamp:2}

  .vazio{text-align:center;padding:70px 20px;color:var(--tinta-suave)}
  .vazio .em{width:56px;height:56px;margin:0 auto 16px;opacity:.5}
  .vazio h3{font-family:var(--serif);font-size:19px;color:var(--tinta);font-weight:600;margin-bottom:6px}
  .vazio p{font-size:14px;max-width:340px;margin:0 auto}

  .skeleton{background:linear-gradient(90deg,var(--papel-2) 25%,#f0ecdf 50%,var(--papel-2) 75%);
    background-size:200% 100%;animation:sk 1.3s infinite;border-radius:8px}
  @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(24px);
    background:var(--verde-selo);color:#fff;padding:13px 24px;border-radius:11px;box-shadow:var(--sombra-carta);
    opacity:0;pointer-events:none;transition:.25s;z-index:60;font-size:14px;border:1.5px solid var(--ouro);
    display:flex;align-items:center;gap:9px}
  .toast.ver{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.erro{background:#8a3223;border-color:#c88}

  .menu-movel{display:none}
  @media (max-width:920px){
    .app{grid-template-columns:1fr}
    aside{position:fixed;left:0;top:0;z-index:50;width:250px;transform:translateX(-100%);transition:transform .25s}
    aside.aberta{transform:translateX(0);box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
    .menu-movel{display:inline-flex;background:none;border:1px solid var(--linha);border-radius:8px;
      width:38px;height:38px;align-items:center;justify-content:center;cursor:pointer;font-size:18px}
    .foco{grid-template-columns:1fr}
    .foco .doc{position:static}
    .kanban{grid-template-columns:1fr 1fr}
  }
  @media (max-width:560px){ .barra{padding:16px 18px} .conteudo{padding:18px} .kanban{grid-template-columns:1fr}
    .barra .busca input{width:150px} }
</style>
</head>
<body>
<div class="app">
  <aside id="lateral">
    <div class="marca">
      <svg class="selo" viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <g stroke="#C8A84B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
          <path d="M34 14 L40 40 L46 14 L52 40 L58 14"/><path d="M16 56 L22 82 L28 56 L34 82 L40 56"/>
          <path d="M52 56 L58 82 L64 56 L70 82 L76 56"/></g>
      </svg>
      <div><h1>Registo de Editais</h1><div class="sub">Moimenta da Beira</div></div>
    </div>
    <nav id="nav">
      <button data-sec="ecra" class="ativo">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
        <span class="txt">No ecrã</span><span class="badge" id="b-ecra">0</span></button>
      <button data-sec="validar" class="destaque">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span class="txt">Por validar</span><span class="badge" id="b-validar">0</span></button>
      <button data-sec="arquivo">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="4" rx="1"/><path d="M5 7v13a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V7M10 11h4"/></svg>
        <span class="txt">Arquivo</span><span class="badge" id="b-arquivo">0</span></button>
      <button data-sec="geral">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span class="txt">Vista geral</span></button>
    </nav>
    <div class="rodape">Sessão de<b id="quemSou">—</b></div>
  </aside>

  <main>
    <div class="barra">
      <button class="menu-movel" id="btnMenu" aria-label="Menu">☰</button>
      <div><h2 id="secTitulo">No ecrã</h2><div class="desc" id="secDesc">Editais publicados no expositor neste momento.</div></div>
      <div class="busca" id="buscaWrap" style="display:none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b6f63" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="busca" type="search" placeholder="Procurar…" autocomplete="off">
      </div>
    </div>
    <div class="conteudo" id="conteudo"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<!-- Lightbox: mostra a pré-visualização em grande ao clicar. Fecha no X, no fundo, ou Esc. -->
<div id="lightbox" class="lightbox">
  <button id="lbFechar" class="lb-fechar" aria-label="Fechar">✕</button>
  <img id="lbImg" src="" alt="Pré-visualização ampliada">
</div>
<script>
  let REGISTOS=[], LABELS={}, secAtual='ecra', focoIdx=0, termoBusca='', aCarregar=true;
  const SEC={
    ecra:{titulo:'No ecrã',desc:'Editais publicados no expositor neste momento.',busca:false},
    validar:{titulo:'Por validar',desc:'Documentos recebidos à espera da sua validação.',busca:false},
    arquivo:{titulo:'Arquivo',desc:'Editais retirados do ecrã. Ficam guardados para consulta.',busca:true},
    geral:{titulo:'Vista geral',desc:'Todos os editais, por estado.',busca:false},
  };
  const fmtData=d=>{if(!d)return '—';const p=d.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d;};
  const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // Escolhe a melhor imagem para pré-visualizar um registo:
  //  1º a pré-visualização leve (existe já no rascunho — o que interessa p/ validar);
  //  2º o PNG final tratado (só existe depois de publicar);
  //  senão, null (mostra-se texto).
  function fontePrevia(r){
    if(r.ficheiros_previa && r.ficheiros_previa.length)
      return '/previa/'+encodeURIComponent(r.ficheiros_previa[0]);
    if(r.ficheiros_png && r.ficheiros_png.length)
      return '/saida/'+encodeURIComponent(r.ficheiros_png[0]);
    return null;
  }
  function toast(msg,erro){const t=document.getElementById('toast');t.className='toast ver'+(erro?' erro':'');
    t.innerHTML=(erro?'⚠ ':'✓ ')+esc(msg);setTimeout(()=>t.classList.remove('ver'),2400);}
  async function carregar(){
    try{
      const r=await fetch('/api/registos');
      if(!r.ok){toast('Sessão expirada — recarregue a página',true);return;}
      const d=await r.json();REGISTOS=d.registos;LABELS=d.estados;aCarregar=false;
      atualizarBadges();render();
    }catch(e){toast('Sem ligação ao servidor',true);}
  }
  function grupo(est){return REGISTOS.filter(r=>r.estado===est);}
  function atualizarBadges(){
    document.getElementById('b-ecra').textContent=grupo('publicado').length;
    document.getElementById('b-validar').textContent=grupo('rascunho').length;
    document.getElementById('b-arquivo').textContent=grupo('retirado').length;
    document.querySelector('[data-sec="validar"]').classList.toggle('destaque',grupo('rascunho').length>0);
  }
  function irPara(sec){
    secAtual=sec;focoIdx=0;termoBusca='';
    document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('ativo',b.dataset.sec===sec));
    document.getElementById('secTitulo').textContent=SEC[sec].titulo;
    document.getElementById('secDesc').textContent=SEC[sec].desc;
    document.getElementById('buscaWrap').style.display=SEC[sec].busca?'block':'none';
    if(document.getElementById('busca'))document.getElementById('busca').value='';
    document.getElementById('lateral').classList.remove('aberta');
    render();
  }
  function render(){
    const c=document.getElementById('conteudo');
    if(aCarregar){c.innerHTML=Array(4).fill('<div class="skeleton" style="height:150px;margin-bottom:16px"></div>').join('');return;}
    if(secAtual==='ecra') return renderLista(grupo('publicado'),'No ecrã, tudo tranquilo','Quando validar e publicar um edital, ele aparece aqui — e no expositor.');
    if(secAtual==='validar') return renderFoco();
    if(secAtual==='arquivo') return renderArquivo();
    if(secAtual==='geral') return renderKanban();
  }
  function renderLista(regs,vazioTit,vazioDesc){
    const c=document.getElementById('conteudo');
    if(!regs.length){c.innerHTML=estadoVazio(vazioTit,vazioDesc);return;}
    c.innerHTML='<div class="grelha">'+regs.map(fichaHTML).join('')+'</div>';ligarFichas();
  }
  function renderFoco(){
    const c=document.getElementById('conteudo');
    const fila=grupo('rascunho');
    if(!fila.length){c.innerHTML=estadoVazio('Nada por validar','Não há documentos à espera. Assim que chegarem novos ficheiros à pasta de entrada, aparecem aqui para validar.');return;}
    if(focoIdx>=fila.length)focoIdx=fila.length-1;
    const r=fila[focoIdx];
    const duv=cs=>(r.campos_duvidosos||[]).includes(cs)?'duvidoso':'';
    // Preferir a pré-visualização LEVE (existe já no rascunho); se não houver,
    // usar o PNG final (editais já publicados); só em último caso, texto vazio.
    const imgSrc=fontePrevia(r);
    const previa=imgSrc
      ? `<img src="${imgSrc}" alt="Documento" class="previa-img" data-full="${imgSrc}">`
      : `<div class="doc-vazio">Pré-visualização a ser gerada…<br>Confirme os dados e valide.</div>`;
    c.innerHTML=`
      <div class="foco-nav">
        <button id="fPrev" ${focoIdx===0?'disabled':''} aria-label="Anterior">‹</button>
        <button id="fNext" ${focoIdx===fila.length-1?'disabled':''} aria-label="Seguinte">›</button>
        <span class="pos">Documento <b>${focoIdx+1}</b> de <b>${fila.length}</b> por validar</span>
        <span class="atalhos" title="Atalhos de teclado">← → navegar · <b>V</b> validar · <b>P</b> publicar</span>
      </div>
      <div class="foco">
        <div class="doc">${previa}</div>
        <div class="ficha-edicao">
          <div class="topo"><span class="reg-grande">${r.numero?esc(r.numero):'Sem número'}</span>
            <span class="carimbo rascunho">Rascunho</span></div>
          <div class="progresso">${r.num_paginas} página(s) · recebido de <b>${esc(r.ficheiro_origem)}</b></div>
          <div class="campo ${duv('assunto')}"><label>Assunto</label>
            <textarea id="f-assunto" rows="2">${esc(r.assunto)}</textarea>
            <div class="nota-conf">⚠ Leitura automática pouco fiável — confirme.</div></div>
          <div class="campo ${duv('numero')}"><label>Número do edital</label>
            <input id="f-numero" value="${esc(r.numero)}">
            <div class="nota-conf">⚠ Confirme o número.</div></div>
          <div class="campo ${duv('data_publicacao')}"><label>Data de publicação <span class="obrig">· obrigatória</span></label>
            <input id="f-data_publicacao" type="date" value="${r.data_publicacao||''}">
            <div class="nota-conf">⚠ Confirme a data de publicação.</div></div>
          <div class="campo"><label>Data de retirada de exposição <span style="color:var(--tinta-suave);font-weight:400;text-transform:none">(opcional)</span></label>
            <input id="f-data_retirada" type="date" value="${r.data_retirada||''}"></div>
          <div class="acoes">
            <button class="btn btn-neutro" data-acao="guardar">Guardar</button>
            <button class="btn btn-validar larga" data-acao="validado">✓ Validar edital</button>
          </div>
          ${historicoHTML(r)}
        </div>
      </div>`;
    document.getElementById('fPrev')?.addEventListener('click',()=>{focoIdx--;render();});
    document.getElementById('fNext')?.addEventListener('click',()=>{focoIdx++;render();});
    ligarAcoesFoco(r);
  }
  function renderArquivo(){
    const c=document.getElementById('conteudo');
    let regs=grupo('retirado').concat(grupo('validado'));
    if(termoBusca){const q=termoBusca.toLowerCase();
      regs=regs.filter(r=>(r.assunto||'').toLowerCase().includes(q)||(r.numero||'').toLowerCase().includes(q));}
    if(!regs.length){c.innerHTML=estadoVazio(termoBusca?'Sem resultados':'Arquivo vazio',
      termoBusca?'Nenhum edital corresponde à procura.':'Os editais retirados do ecrã aparecem aqui.');return;}
    c.innerHTML='<div class="grelha">'+regs.map(fichaHTML).join('')+'</div>';ligarFichas();
  }
  function renderKanban(){
    const c=document.getElementById('conteudo');
    const cols=[['rascunho','Rascunho'],['validado','Validado'],['publicado','Publicado'],['retirado','Retirado']];
    c.innerHTML='<div class="kanban">'+cols.map(([e,t])=>{
      const regs=grupo(e);
      return `<div class="coluna c-${e}"><h3><span class="pt"></span>${t}<span class="cnt">${regs.length}</span></h3>
        ${regs.length?regs.map(fichaHTML).join(''):'<div style="color:var(--tinta-suave);font-size:12.5px;text-align:center;padding:16px;font-style:italic">Vazio</div>'}</div>`;
    }).join('')+'</div>';ligarFichas();
  }
  function fichaHTML(r){
    const duv=(r.campos_duvidosos||[]).length;
    const aviso=duv?`<div class="aviso">⚠ ${duv} campo${duv>1?'s':''} a confirmar</div>`:'';
    return `<div class="ficha e-${r.estado}" data-id="${r.id}">
      <div class="cab"><div class="reg">${r.numero?esc(r.numero):'—'}<small>Registo #${r.id}</small></div>
        <span class="carimbo ${r.estado}">${LABELS[r.estado]||r.estado}</span></div>
      <div class="assunto">${esc(r.assunto)||'<em style="color:var(--tinta-suave)">sem assunto</em>'}</div>
      <div class="meta">
        <div class="l"><span>Publicação</span><b>${fmtData(r.data_publicacao)}</b></div>
        <div class="l"><span>Retirada</span><b>${fmtData(r.data_retirada)}</b></div>
      </div>${aviso}</div>`;
  }
  function historicoHTML(r){
    const evs=(r.historico||[]).slice().reverse().map(h=>{
      const de=h.de?(LABELS[h.de]||h.de):'entrada',para=LABELS[h.para]||h.para;
      return `<div class="ev"><span class="quem">${esc(h.utilizador)}</span>
        <span class="fluxo">${de} → ${para}</span><span class="quando">${h.em.replace('T',' ').slice(0,16)}</span></div>`;
    }).join('');
    return `<div class="historico"><h4>Histórico</h4>${evs||'<div class="ev">Sem eventos</div>'}</div>`;
  }
  function estadoVazio(tit,desc){
    return `<div class="vazio"><svg class="em" viewBox="0 0 24 24" fill="none" stroke="var(--ouro)" stroke-width="1.4"><path d="M20 6L9 17l-5-5"/></svg>
      <h3>${esc(tit)}</h3><p>${esc(desc)}</p></div>`;
  }
  function ligarFichas(){
    document.querySelectorAll('.ficha').forEach(f=>f.addEventListener('click',()=>{
      const id=+f.dataset.id, r=REGISTOS.find(x=>x.id===id); if(!r)return;abrirDetalhe(r);
    }));
  }
  function abrirDetalhe(r){
    if(r.estado==='rascunho'){irPara('validar');const fila=grupo('rascunho');focoIdx=Math.max(0,fila.findIndex(x=>x.id===r.id));render();return;}
    const duv=cs=>(r.campos_duvidosos||[]).includes(cs)?'duvidoso':'';
    const imgSrc=fontePrevia(r);
    const previa=imgSrc
      ? `<img src="${imgSrc}" alt="Documento" class="previa-img" data-full="${imgSrc}">`
      : `<div class="doc-vazio">Sem pré-visualização.</div>`;
    const acoes = r.estado==='publicado'
      ? `<button class="btn btn-neutro" data-acao="guardar">Guardar</button><button class="btn btn-perigo larga" data-acao="retirado">Retirar do ecrã</button>`
      : r.estado==='validado'
      ? `<button class="btn btn-neutro" data-acao="guardar">Guardar</button><button class="btn btn-acao" data-acao="publicado">▲ Publicar no ecrã</button><button class="btn btn-neutro" data-acao="rascunho">Devolver</button>`
      : `<button class="btn btn-acao larga" data-acao="publicado">Repor no ecrã</button>`;
    const c=document.getElementById('conteudo');
    c.innerHTML=`<div class="foco-nav"><button id="voltar" aria-label="Voltar">‹</button><span class="pos">Voltar a ${SEC[secAtual].titulo}</span></div>
      <div class="foco"><div class="doc">${previa}</div>
      <div class="ficha-edicao">
        <div class="topo"><span class="reg-grande">${r.numero?esc(r.numero):'Sem número'}</span><span class="carimbo ${r.estado}">${LABELS[r.estado]}</span></div>
        <div class="progresso">${r.num_paginas} página(s) · registo #${r.id}</div>
        <div class="campo ${duv('assunto')}"><label>Assunto</label><textarea id="f-assunto" rows="2">${esc(r.assunto)}</textarea><div class="nota-conf">⚠ Confirme.</div></div>
        <div class="campo ${duv('numero')}"><label>Número do edital</label><input id="f-numero" value="${esc(r.numero)}"><div class="nota-conf">⚠ Confirme.</div></div>
        <div class="campo ${duv('data_publicacao')}"><label>Data de publicação <span class="obrig">· obrigatória</span></label><input id="f-data_publicacao" type="date" value="${r.data_publicacao||''}"><div class="nota-conf">⚠ Confirme.</div></div>
        <div class="campo"><label>Data de retirada</label><input id="f-data_retirada" type="date" value="${r.data_retirada||''}"></div>
        <div class="acoes">${acoes}</div>
        ${historicoHTML(r)}
      </div></div>`;
    document.getElementById('voltar').addEventListener('click',()=>render());
    ligarAcoesFoco(r);
  }
  function camposDe(){
    const g=id=>document.getElementById(id);
    return {assunto:g('f-assunto')?.value.trim(),numero:g('f-numero')?.value.trim(),
      data_publicacao:g('f-data_publicacao')?.value||null,data_retirada:g('f-data_retirada')?.value||null};
  }
  // Cabeçalhos de escrita. O X-Painel-Pedido é o que distingue um pedido nascido
  // desta página de um POST forjado por outro sítio com as credenciais Basic em
  // cache — um <form> de terceiros não consegue pôr cabeçalhos personalizados.
  const CAB_ESCRITA={'Content-Type':'application/json','X-Painel-Pedido':'1'};
  async function guardar(id){
    const r=await fetch('/api/editar',{method:'POST',headers:CAB_ESCRITA,
      body:JSON.stringify({id,campos:camposDe()})});
    if(!r.ok){toast('Não foi possível guardar',true);return false;}
    return true;
  }
  function ligarAcoesFoco(r){
    document.querySelectorAll('.acoes .btn').forEach(b=>b.addEventListener('click',()=>executarAcao(r,b.dataset.acao)));
  }
  // Executa uma ação de estado sobre o registo r. Centralizada (e não inline no
  // handler) para poder ser chamada também pelos atalhos de teclado.
  async function executarAcao(r,a){
    await guardar(r.id);
    if(a==='guardar'){toast('Alterações guardadas');await carregar();return;}
    // Retirar do ecrã é destrutivo (some da TV): pede confirmação para evitar
    // enganos. As restantes transições são reversíveis, seguem direto.
    if(a==='retirado'){
      const assunto=(r.assunto||'este edital').slice(0,60);
      if(!confirm(`Retirar do ecrã?\n\n"${assunto}"\n\nDeixa de aparecer no expositor. O ficheiro fica guardado no arquivo e pode ser reposto depois.`)) return;
    }
    const res=await(await fetch('/api/estado',{method:'POST',headers:CAB_ESCRITA,
      body:JSON.stringify({id:r.id,estado:a})})).json();
    if(!res.ok){toast(res.erro||'Ação não permitida',true);return;}
    const nomes={validado:'Edital validado',publicado:'Publicado no ecrã',rascunho:'Devolvido a rascunho',retirado:'Retirado do ecrã'};
    toast(nomes[a]||'Feito');await carregar();render();
  }
  document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>irPara(b.dataset.sec)));
  document.getElementById('btnMenu').addEventListener('click',()=>document.getElementById('lateral').classList.toggle('aberta'));
  // Lightbox: clicar numa pré-visualização abre-a em grande. Delegação de evento
  // (no documento) porque as imagens são recriadas a cada render.
  document.addEventListener('click',function(e){
    const img=e.target.closest('.previa-img');
    if(img){ const lb=document.getElementById('lightbox');
      document.getElementById('lbImg').src=img.getAttribute('data-full');
      lb.classList.add('aberto'); }
  });
  function fecharLightbox(){ document.getElementById('lightbox').classList.remove('aberto');
    document.getElementById('lbImg').src=''; }
  document.getElementById('lbFechar').addEventListener('click',fecharLightbox);
  document.getElementById('lightbox').addEventListener('click',function(e){
    if(e.target.id==='lightbox') fecharLightbox();  // clicar no fundo fecha
  });
  document.getElementById('busca').addEventListener('input',e=>{termoBusca=e.target.value;render();});
  document.getElementById('quemSou').textContent=localStorage.getItem('cmmb_nome')||'utilizador';
  // Atalhos de teclado. Ignora-se quando o foco está num campo de texto (senão
  // escrever "v" no assunto disparava a validação).
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){ const lb=document.getElementById('lightbox');
      if(lb.classList.contains('aberto')){ fecharLightbox(); return; } }
    const aEditar=document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if(aEditar) return;
    if(secAtual==='validar'){
      if(e.key==='ArrowRight')document.getElementById('fNext')?.click();
      if(e.key==='ArrowLeft')document.getElementById('fPrev')?.click();
      // V = validar, P = publicar — só agem se o botão respetivo existir no estado atual.
      if(e.key==='v'||e.key==='V'){const btn=document.querySelector('.acoes [data-acao="validado"]');if(btn)btn.click();}
      if(e.key==='p'||e.key==='P'){const btn=document.querySelector('.acoes [data-acao="publicado"]');if(btn)btn.click();}
    }
  });
  carregar();
  setInterval(()=>{ if(!document.querySelector('.ficha-edicao textarea:focus, .ficha-edicao input:focus')) carregar(); },20000);
</script>
</body>
</html>
