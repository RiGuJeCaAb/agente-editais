# Revisão automática das PRs, contra as regras desta casa.
#
# A razão de existir está no CHANGELOG da 0.20.1: o revisor que aqui estava
# revia contra convenções genéricas porque não tinha como conhecer as nossas.
# Este começa por ler o AGENTS.md, que é onde elas vivem.
#
# Corre com a conta Claude de quem mantém o projeto e não com uma chave de API:
# o token sai do `claude setup-token` e guarda-se no segredo
# CLAUDE_CODE_OAUTH_TOKEN, em Settings > Secrets and variables > Actions.
name: revisao

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  rever:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    # O segredo não está acessível num `if` de passo, mas está aqui. Sem esta
    # passagem por env, um repositório sem credencial punha TODAS as PRs a
    # vermelho — e uma revisão que estraga o CI é pior do que revisão nenhuma.
    env:
      TEM_CREDENCIAL: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Rever a PR
        if: env.TEM_CREDENCIAL == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Um comentário que se atualiza, em vez de um novo a cada push. As
          # PRs daqui levam correções a meio da revisão, e três revisões
          # empilhadas sobre o mesmo ficheiro não se leem.
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            O ramo desta PR já está na pasta de trabalho.

            Antes de rever, lê o `AGENTS.md` na raiz. São as regras desta casa:
            a língua, o que conta como teste que prova alguma coisa, a ordem de
            gravidade dos defeitos neste projeto e o que explicitamente não
            vale um comentário. Revê contra elas. Se não conseguires ler esse
            ficheiro, diz isso num comentário em vez de reveres contra
            convenções genéricas.

            Escreve em português europeu, sem emojis, e trata quem lê por tu.

            Comenta o que é defeito. Não comentes estilo que o `ruff` não
            impõe, renomeações sem razão, nem anotações de tipo onde o `mypy`
            já está satisfeito. Uma revisão que enche a PR de ruído deixa de
            ser lida, e aí não serviu para nada.

            Se não encontrares nada, diz que não encontraste nada. É uma
            resposta legítima e vale mais do que inventar achados para
            justificar a corrida.

            Usa `gh pr comment` para o comentário de topo e
            `mcp__github_inline_comment__create_inline_comment` (com
            `confirmed: true`) para apontar linhas concretas. Publica só
            comentários no GitHub — não devolvas a revisão como mensagem.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      - name: Dizer o que falta
        if: env.TEM_CREDENCIAL != 'true'
        run: |
          echo "Sem revisão: falta o segredo CLAUDE_CODE_OAUTH_TOKEN."
          echo "Gera-o com 'claude setup-token' e põe-no em"
          echo "Settings > Secrets and variables > Actions."
