# Integração contínua: corre o que um programador correria antes de entregar.
# Não instala o LibreOffice nem o Tesseract de propósito — são opcionais em
# execução, e os testes têm de provar que o agente funciona sem eles.
name: verificacao

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 é o mínimo declarado; 3.12 apanha o que for depreciado.
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Análise estática
        run: ruff check .
      - name: Verificação de tipos
        run: mypy lib/ agente.py
      - name: Testes
        run: pytest
