# Integração contínua: corre o que um programador correria antes de entregar.
# Não instala o LibreOffice nem o Tesseract de propósito — são opcionais em
# execução, e os testes têm de provar que o agente funciona sem eles.
name: verificacao

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 é o mínimo declarado; 3.12 apanha o que for depreciado.
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Análise estática
        run: ruff check .
      - name: Verificação de tipos
        run: mypy lib/ agente.py
      - name: Testes
        run: pytest

  # Os assuntos dos commits escrevem-se sem acentos, por hábito de consola. Não
  # é um teste do pytest de propósito: um teste precisaria do `origin/main` para
  # saber que commits são desta PR, e quem corre o pytest à mão nem sempre o tem
  # — passaria em silêncio por não ter o que ver. Aqui o intervalo é explícito, e
  # sem ele a verificação falha.
  assuntos:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Sem isto o checkout traz só a cabeça e o intervalo não se resolve.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assuntos de commit sem acentos
        run: |
          python ferramentas/assuntos_sem_acentos.py \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

  # A página da televisão é o produto, e até à 0.24.0 nenhum teste a abria:
  # verificava-se o HTML por pesquisa de texto. Foi assim que passou o defeito
  # que punha a folha a ocupar 7,7% de um monitor vertical sem uma única linha
  # vermelha. Estes testes abrem-na mesmo, num Chromium, e medem o que lá está
  # desenhado.
  #
  # Trabalho à parte, e numa versão só: o playwright não é dependência de
  # execução do agente, e instalá-lo nas duas pernas da matriz pagava duas vezes
  # por uma verificação que não depende da versão do Python.
  televisao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" playwright
      - name: Instalar o Chromium
        run: python -m playwright install --with-deps chromium
      - name: Testes da página da televisão
        run: pytest -m navegador
