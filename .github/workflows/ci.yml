# Integração contínua: corre o que um programador correria antes de entregar.
# Não instala o LibreOffice nem o Tesseract de propósito — são opcionais em
# execução, e os testes têm de provar que o agente funciona sem eles.
name: verificacao

on:
  push:
    branches: [main]
  pull_request:

# Só leitura, e para o fluxo inteiro. Todos estes trabalhos correm código vindo
# da PR — o pytest, e agora também a ferramenta dos assuntos —, e o checkout
# guarda o GITHUB_TOKEN na configuração do git da pasta de trabalho. Com
# permissões de escrita por omissão, esse código podia levar o testemunho
# consigo. Apanhado pelo Sourcery na revisão da PR que acrescentou o trabalho
# dos assuntos; vale para os outros dois pela mesma razão.
permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 é o mínimo declarado; 3.12 apanha o que for depreciado.
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Análise estática
        run: ruff check .
      - name: Verificação de tipos
        run: mypy lib/ agente.py
      - name: Testes
        run: pytest

  # As duas regras que precisam do INTERVALO de commits da PR, e que por isso
  # não podem ser testes do pytest: um teste precisaria do `origin/main`, que
  # quem corre a suite à mão nem sempre tem, e passaria em silêncio por não ter
  # o que ver. Aqui o intervalo é explícito, e sem ele as ferramentas falham.
  regras_da_pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Sem isto o checkout traz só a cabeça e o intervalo não se resolve.
          fetch-depth: 0
          # A ferramenta lê o histórico que já está em disco e não fala com o
          # GitHub: não há razão para lhe deixar o testemunho à mão.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assuntos de commit sem acentos
        run: |
          python ferramentas/assuntos_sem_acentos.py \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"
      - name: A versão subiu
        run: |
          python ferramentas/versao_subiu.py \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

  # A página da televisão é o produto, e até à 0.24.0 nenhum teste a abria:
  # verificava-se o HTML por pesquisa de texto. Foi assim que passou o defeito
  # que punha a folha a ocupar 7,7% de um monitor vertical sem uma única linha
  # vermelha. Estes testes abrem-na mesmo, num Chromium, e medem o que lá está
  # desenhado.
  #
  # Trabalho à parte, e numa versão só: o playwright não é dependência de
  # execução do agente, e instalá-lo nas duas pernas da matriz pagava duas vezes
  # por uma verificação que não depende da versão do Python.
  televisao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" playwright
      - name: Instalar o Chromium
        run: python -m playwright install --with-deps chromium
      - name: Testes da página da televisão
        run: pytest -m navegador
