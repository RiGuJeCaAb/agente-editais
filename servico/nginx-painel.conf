# O painel em HTTPS, com o certificado da autoridade de certificação da Câmara.
#
# O painel continua a escutar só em 127.0.0.1:8770. Quem fala com a rede é o
# nginx, que cifra a ligação e passa os pedidos ao painel por dentro da VM.
#
# Instalação (os passos completos, incluindo o certificado, estão em
# servico/HYPER-V.md, «Fase 2 — o painel em HTTPS»):
#   sudo cp servico/nginx-painel.conf /etc/nginx/sites-available/painel
#   sudo nano /etc/nginx/sites-available/painel     # substitui <DOMINIO.DNS>
#   sudo ln -s /etc/nginx/sites-available/painel /etc/nginx/sites-enabled/painel
#   sudo nginx -t && sudo systemctl reload nginx
#
# E no config.json do agente: "painel_atras_de_proxy": true.

# Quem abrir o HTTPS pelo endereço IP da VM, ou por outro nome qualquer, não
# chega ao painel com um aviso de certificado: a ligação é recusada logo no
# início. Um aviso que se ultrapassa uma vez ensina a ultrapassá-los sempre.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

# Quem escrever o endereço sem https vai parar ao https. A televisão não é
# afetada: é servida pelo bloco default_server do nginx-editais.conf, pelo
# endereço IP, e este bloco só responde ao nome do painel.
server {
    listen 80;
    listen [::]:80;
    server_name agente-edital-digital.<DOMINIO.DNS>;
    return 301 https://$host$request_uri;
}

server {
    # Sem HTTP/2 de propósito: um painel interno de poucas pessoas não ganha
    # nada com ele, e a forma de o ligar mudou na versão 1.25 do nginx — o que
    # está certo numa versão dá erro ou aviso na outra.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name agente-edital-digital.<DOMINIO.DNS>;

    # O certificado do servidor seguido do da autoridade que o emitiu (e das
    # intermédias, se as houver). Sem a cadeia, um posto que não tenha a
    # intermédia em cache recusa a ligação, e o erro não diz porquê.
    ssl_certificate     /etc/ssl/agente-edital-digital/cadeia.pem;
    ssl_certificate_key /etc/ssl/agente-edital-digital/chave.pem;

    # Só TLS 1.2 e 1.3. Qualquer Windows e browser em uso na Câmara os tem.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # O browser passa a recusar o painel por HTTP durante um ano, mesmo que
    # alguém escreva o endereço sem https. Fica de fora o includeSubDomains:
    # este nome não manda nos outros do domínio.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8770;

        # O Host tem de passar tal como veio: o painel recusa escritas cuja
        # Origin não coincida com ele (a defesa contra CSRF), e sem isto todas
        # as escritas eram recusadas.
        proxy_set_header Host $http_host;

        # O endereço verdadeiro de quem pede, posto por cima do que o cliente
        # tenha mandado. O painel conta as tentativas de entrada falhadas por
        # endereço; sem isto, toda a gente chegava como 127.0.0.1.
        proxy_set_header X-Real-IP $remote_addr;

        # Publicar compõe as imagens dos editais antes de responder, e um
        # documento grande leva dezenas de segundos. Os 60 s de omissão do nginx
        # cortavam a resposta, e o painel dizia erro de uma publicação que tinha
        # corrido bem.
        proxy_read_timeout 300s;
    }
}
