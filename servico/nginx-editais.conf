# Servidor da televisão: serve a pasta saida/ como site estático.
#
# Instalação (Debian):
#   sudo cp servico/nginx-editais.conf /etc/nginx/sites-available/editais
#   sudo ln -s /etc/nginx/sites-available/editais /etc/nginx/sites-enabled/editais
#   sudo rm /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# A televisão aponta para http://ENDERECO-DA-VM/ e nunca mais lhe mexes.
#
# Porque um servidor à parte, e não o painel: a televisão não tem sessão, e o
# painel exige-a em todas as rotas menos a de entrada e o /saude. Servir a
# saida/ por aqui deixa o painel fechado e a televisão sem credenciais nenhumas
# guardadas no Raspberry Pi.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/agente-editais/saida;
    index index.html;
    autoindex off;

    # O index.html muda a cada atualização do agente. Sem isto, um recarregar
    # normal da televisão podia servir a página antiga da cache do browser e
    # obrigar ao Ctrl+F5 que um Raspberry Pi em quiosque não tem.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # A página já pede o slides.json com no-store e um carimbo no endereço; isto
    # é a mesma regra do lado de quem serve, para um proxy pelo meio não a anular.
    location = /slides.json {
        add_header Cache-Control "no-store";
    }

    # Os ZIP de arquivo também vivem na saida/, mas a televisão não os usa, e
    # não há razão para os deixar descarregar a quem estiver na rede.
    location ~* \.zip$ {
        return 404;
    }

    # Ficheiros temporários da gravação atómica, que existem por instantes.
    location ~ \.tmp$ {
        return 404;
    }
}
